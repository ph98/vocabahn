# Local development: Postgres + Redis only; api/web run via `pnpm dev`.
# Production api/web/nginx services are added in the deploy phase (PRD §5).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: vocabahn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vocabahn"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  directus:
    image: directus/directus:11
    ports:
      - "8055:8055"
    environment:
      KEY: ${DIRECTUS_KEY:-vocabahn-local-secret-key-12345}
      SECRET: ${DIRECTUS_SECRET:-vocabahn-local-system-secret-12345}
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: vocabahn
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SEARCH_PATH: directus,public
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@vocabahn.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-adminpassword}
      PUBLIC_URL: http://localhost:8055
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  redis-data:

