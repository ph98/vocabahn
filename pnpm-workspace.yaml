packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@google/genai'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma
  - protobufjs

overrides:
  # Each entry below pins a transitive dependency past a published advisory that
  # its own parent has not yet released a fix for. Drop an entry once the parent
  # ships a version that resolves to the patched range on its own.
  brace-expansion: ^5.0.9 # GHSA-rgw5-rvv9-x895 — DoS via unbounded intermediate
  deepmerge-ts: ^8.0.0 # GHSA-ggr8-5vv4-36mx — stack exhaustion on recursive graphs
  fast-uri: ^3.1.5 # GHSA — host confusion via backslash
  js-yaml: ^4.3.1 # GHSA-5p4m-2wfm-xmqj — quadratic CPU in !!omap
  nanoid: ^3.3.18 # GHSA-2v37-7h3g-55p8 — custom generators can loop forever
  react-router: ^8.3.0
  tinymce: ^7.9.3

patchedDependencies:
  brace-expansion@5.0.9: patches/brace-expansion@5.0.9.patch
