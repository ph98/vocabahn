# Production deployment — all services containerized on a single VPS.
# Usage: see docs/operations.md and scripts/deploy.sh
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocabahn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: vocabahn
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups          # backup target (scripts/backup.sh)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocabahn -d vocabahn"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # Stamped into the image so deploy.sh can prove the artifact matches the
        # revision being deployed. Set by deploy.sh; `unknown` for manual builds.
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    # The host has ~3.7 GB and no swap, so an unbounded API is a host-wide
    # outage: the kernel OOM killer picks a victim and SSH becomes unusable.
    # With a limit the container dies alone, is reported as OOMKilled, and the
    # healthcheck below marks it unhealthy instead of it looking "Up".
    # Steady state is ~260 MB and boot peaks near 310 MB.
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:3000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vocabahn:${POSTGRES_PASSWORD}@db:5432/vocabahn
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ./service-account.json:/repo/service-account.json:ro
      - ./data:/repo/data:ro
      - audio-data:/repo/apps/api/static/audio

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID}}
        VITE_USERSNAP_API_KEY: ${VITE_USERSNAP_API_KEY:-}
        # Baked into the bundle at build time — setting these on the server
        # after the image exists has no effect. Rebuild to change them.
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro         # TLS certs (see docs/operations.md §4)
      - ./apps/web/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - directus
    networks:
      - internal

  directus:
    image: directus/directus:11
    restart: unless-stopped
    ports: []
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: vocabahn
      DB_USER: vocabahn
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SEARCH_PATH: directus,public
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: https://admin.vocabahn.app
      AUTH_GOOGLE_ENABLED: "true"
      AUTH_GOOGLE_DRIVER: google
      AUTH_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      AUTH_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AUTH_DISABLE_DEFAULT_URL_REDIRECT: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  db-data:
  redis-data:
  audio-data:

networks:
  internal:
    driver: bridge
