# Production deploy: db, redis, api, and web/nginx all containerized on a
# single VPS (PRD §5). For local dev, use docker-compose.yml + `pnpm dev` instead.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: vocabahn
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vocabahn"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      # Override host-oriented values from .env with in-network service names.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/vocabahn
      REDIS_URL: redis://redis:6379
      GOOGLE_APPLICATION_CREDENTIALS: /repo/service-account.json
    volumes:
      - ./service-account.json:/repo/service-account.json:ro
      - static-data:/repo/apps/api/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
  static-data:
