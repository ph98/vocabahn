# Staging nginx — HTTPS termination + SPA routing + API proxy + Search Indexing Prevention.
# Place your TLS certs at ./ssl/cert.pem and ./ssl/key.pem on the host.
server {
    listen 80;
    listen 443 ssl http2;
    server_name staging.vocabahn.app _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Prevent search engine indexing of staging environment
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    # Service Worker script — must never be cached so updates apply immediately
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    }

    # Static assets — long cache, immutable Vite hashes
    location ~* \.(?:js|css|woff2?|ttf|svg|png|ico|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    }
}
