<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Vocabahn — Learn German in the Fast Lane</title>
    <meta
      name="description"
      content="Vocabahn: learn German vocabulary with an AI-enriched dictionary, FSRS-powered spaced-repetition flashcards, and CEFR level progression."
    />
    
    <!-- Icons & Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vocabahn.app/" />
    <meta property="og:site_name" content="Vocabahn" />
    <meta property="og:title" content="Vocabahn — Learn German in the Fast Lane" />
    <meta property="og:description" content="Master German vocabulary with FSRS spaced repetition, AI-enriched dictionary definitions, and structured CEFR progression." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vocabahn — Learn German in the Fast Lane" />
    <meta name="twitter:description" content="German vocabulary app with FSRS spaced repetition and AI-enriched dictionary." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vocabahn-theme');
          var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.classList.add('theme-' + stored);
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#0a0a0a' : '#fafafa');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
