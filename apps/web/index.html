    <!-- Typography.
         Plus Jakarta Sans is self-hosted (@font-face in index.css) and
         preloaded: it is the body font, every page needs it, and it used to
         arrive through a render-blocking third-party stylesheet that cost
         793 ms before first paint. `crossorigin` is required even same-origin
         — fonts are always fetched in CORS mode, and without it the browser
         makes a second, uncredited request and the preload is wasted.

         Merriweather is not preloaded and not render-blocking. It appears on
         exactly two headings, both behind sign-in, so `unicode-range` matching
         means the font file is never fetched on the landing page at all — only
         this 1.5 kB stylesheet, and `media="print"` keeps even that out of the
         critical path until it has loaded. Narrowed from 8 variants to the
         roman axis: nothing in the app renders italic. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plus-jakarta-sans-v12-latin.woff2" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400..700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400..700&display=swap" />
    </noscript>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vocabahn-theme');
          var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.classList.add('theme-' + stored);
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#0a0a0a' : '#FBFBFA');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
